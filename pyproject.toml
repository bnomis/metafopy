[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "metafopy"
version = "0.0.1"
description = "Meta-analysis in Python: a re-implementation of the R metafor package"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Simon" }]
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "formulaic>=1.0",
    "matplotlib>=3.8",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bnomis/metafopy"
"R metafor" = "https://www.metafor-project.org/"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mpl>=0.17",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.18",
    "pre-commit>=3.7",
    "pandas-stubs>=2.1",
    "scipy-stubs>=1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metafopy"]

[tool.ruff]
line-length = 160
target-version = "py314"
src = ["src"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT", "Q"]
ignore = [
    "SIM108",  # nested ternaries read worse than if/else blocks at 160 columns
    "N802",  # metafor-style names such as rma_uni / QE are intentional
    "N803",
    "N806",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.isort]
known-local-folder = ["reference_data"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
mypy_path = ["src/tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["formulaic", "formulaic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-ra --strict-markers"
markers = [
    "rparity: live comparison against R metafor through rpy2 (needs R installed)",
    "slow: takes more than 10 seconds; skip with -m 'not slow'",
]

[tool.coverage.run]
source = ["metafopy"]
branch = true
