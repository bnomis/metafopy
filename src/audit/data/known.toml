# Differences that are accepted, each with its reason and where docs/differences.md records it. A finding that matches an entry is left out of the
# report; an entry that matches nothing in a full run is stale and is reported, so this file cannot outlive the difference it records.
# `match` is a glob on the case id, `kind` and `path` are globs (default `*`).

[[known]]
match = "matrix/summary/*"
kind = "missing-field"
reason = "summary() returns the printed text; the fields of R's summary object are the fields of the fit, which the fit cases compare."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_bcg"
kind = "value-diff"
path = "$[pQ]*"
reason = "rma_glmm(measure='OR', model='UM.FS') zval -4.2436 against R's -4.2434; untraced."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_bcg"
kind = "print-diff"
reason = "rma_glmm mixed-model fits agree with R to between 2e-3 and 1e-1 relative; see the rma_glmm entries."
ref = "docs/differences.md"

[[known]]
match = "matrix/gosh/*"
reason = "gosh(seed=) is bit-exact with R only where dbinom ties break the same way (R 4.5.1 on Linux); this oracle is R 4.3.3."
ref = "docs/differences.md"

[[known]]
match = "*/reporter*"
reason = "reporter() writes an R Markdown report; Jupyter notebooks are the Python equivalent."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "missing-field"
path = "*$chksum*"
reason = "R keeps checksums of the data to detect changes between refits (chksumX, chksumyi, chksumvi, chksumV); metafopy keeps the arrays themselves."

[[known]]
match = "*"
kind = "missing-field"
path = "*$version"
reason = "R stores packageVersion('metafor') in every fit; metafopy has no R package version to store."

[[known]]
match = "*"
kind = "missing-field"
path = "*$time"
reason = "R stores the system time the fit took; not a result of the analysis."

[[known]]
match = "*"
kind = "missing-field"
path = "*$verbose"
reason = "R stores the verbose setting the fit was called with; metafopy does not keep it."

[[known]]
match = "*"
kind = "accepts-where-R-refuses"
detail = "R: object 'out' not found*"
reason = "metafor 5.2-1 stops with the internal error \"object 'out' not found\" when options(na.action='na.fail') is set; metafopy gives the result."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "accepts-where-R-refuses"
detail = "R: *did not achieve convergence*"
reason = "R's optimiser stops without convergence on this case and R refuses the fit; metafopy's optimiser converges."

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*ontrol*optimizer*"
reason = "R silently ignores control entries a function does not use (here 'optimizer'); metafopy raises for unknown control entries so a misspelt setting is not lost."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*unexpected arguments:*"
reason = "Plot '...' arguments are explicit keywords; R passes unknown graphical parameters to par() or ignores them."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*unknown dataset*"
reason = "The data sets that are lists of data frames (not tables) are not bundled."
ref = "docs/differences.md"

[[known]]
match = "api/*/code[1-4]"
kind = "missing-arg"
reason = "code1 to code4 are undocumented switches R reads from '...' to debug a computation (ddd$code1); they have no stated behaviour to match."
ref = "docs/differences.md"

[[known]]
match = "api/*/progbar"
kind = "default-diff"
reason = "progbar defaults to False: a text progress bar has no use outside a console and would pollute notebook output."
ref = "docs/differences.md"

[[known]]
match = "api/plot/*"
kind = "missing-arg"
reason = "plot_rma and its relatives take the graphical parameters of R's par() and plot() as explicit keywords, so the ones that have no matplotlib counterpart are refused."
ref = "docs/differences.md"

[[known]]
match = "api/*/nearPD"
kind = "missing-arg"
reason = "R documents the formal as nearpd and reads the old spelling nearPD from '...' only to be compatible; Python has nearpd."
ref = "docs/differences.md"

[[known]]
match = "api/*/formula."
kind = "missing-arg"
reason = "update(formula.=) is the stats::update.default spelling of a formula edit; update takes formula as a keyword."
ref = "docs/differences.md"

[[known]]
match = "api/metafor.news"
kind = "missing-function"
reason = "metafor.news() opens the R package's NEWS file; the Python changelog is the repository's."
ref = "docs/differences.md"

[[known]]
match = "api/*/*/progbar"
kind = "missing-arg"
reason = "R refuses cooks.distance, dfbetas, rstudent and influence for location-scale and selection fits (.chkclass inside influence.rma.uni), so the reads of progbar and digits there are unreachable."
ref = "docs/differences.md"

[[known]]
match = "api/*/*/digits"
kind = "missing-arg"
reason = "R refuses rstudent for location-scale and selection fits (.chkclass inside influence.rma.uni), so its digits are unreachable."
ref = "docs/differences.md"

[[known]]
match = "api/hettest/method"
kind = "default-diff"
reason = "R's method = NULL resolves to the model's own method and Python's None does the same."
ref = "docs/differences.md"

[[known]]
match = "api/robust/*/clubSandwich"
kind = "default-diff"
reason = "clubSandwich is the camelCase alias of club_sandwich that R reads from '...'; None means 'not given'."
ref = "docs/differences.md"

[[known]]
match = "api/addpoly/*"
kind = "default-diff"
reason = "R's rows = NULL and Python's None both fall back to row = -2."
ref = "docs/differences.md"

[[known]]
match = "api/forest/*/addpred"
kind = "default-diff"
reason = "None stands for R's FALSE and also admits the cumulative-result forms of addpred (names or positions)."
ref = "docs/differences.md"

[[known]]
match = "api/forest/*/predstyle"
kind = "default-diff"
reason = "None stands for R's 'line'."
ref = "docs/differences.md"

[[known]]
match = "api/rma*/*"
kind = "missing-arg"
reason = "outlist, retopt, randhet, omega2, pleasedonotreportI2thankyouverymuch, retdat, retfit, skiphet, tdist, cutoff and vtype: undocumented or experimental internals of R's fitting functions (arbitrary R lists, optimiser output, R-specific switches), see docs/differences.md."
ref = "docs/differences.md"

[[known]]
match = "api/vif/*"
kind = "missing-arg"
reason = "R's vif() of rma.mh, rma.peto and rma.glmm fits stops (VIFs are not applicable to intercept-only models), so none of its arguments is reachable; Python raises ArgumentError."
ref = "docs/differences.md"

[[known]]
match = "api/reporter/*"
kind = "missing-function"
reason = "reporter() writes an R Markdown report; Jupyter notebooks are the Python equivalent."
ref = "docs/differences.md"

[[known]]
match = "api/profile/*/plot"
kind = "default-diff"
reason = "plot defaults to False in every Python profile method (R: TRUE); a profile is drawn with plot_profile or plot=True."
ref = "docs/differences.md"

[[known]]
match = "api/rma.glmm/model"
kind = "default-diff"
reason = "model=None is R's default 'UM.FS'; None lets rma_glmm tell a model that was passed (and is irrelevant for one-group measures, which warns as in R) from the default."
ref = "docs/differences.md"
