# Differences that are accepted, each with its reason and where docs/differences.md records it. A finding that matches an entry is left out of the
# report; an entry that matches nothing in a full run is stale and is reported, so this file cannot outlive the difference it records.
# `match` is a glob on the case id, `kind` and `path` are globs (default `*`).

[[known]]
match = "matrix/summary/*"
kind = "missing-field"
reason = "summary() returns the printed text; the fields of R's summary object are the fields of the fit, which the fit cases compare."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_bcg"
kind = "value-diff"
path = "$[pQ]*"
reason = "rma_glmm(measure='OR', model='UM.FS') zval -4.2436 against R's -4.2434; untraced."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_bcg"
kind = "print-diff"
reason = "rma_glmm mixed-model fits agree with R to between 2e-3 and 1e-1 relative; see the rma_glmm entries."
ref = "docs/differences.md"

[[known]]
match = "matrix/gosh/*"
reason = "gosh(seed=) is bit-exact with R only where dbinom ties break the same way (R 4.5.1 on Linux); this oracle is R 4.3.3."
ref = "docs/differences.md"

[[known]]
match = "*/reporter*"
reason = "reporter() writes an R Markdown report; Jupyter notebooks are the Python equivalent."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "missing-field"
path = "*$chksum*"
reason = "R keeps checksums of the data to detect changes between refits (chksumX, chksumyi, chksumvi, chksumV); metafopy keeps the arrays themselves."

[[known]]
match = "*"
kind = "missing-field"
path = "*$version"
reason = "R stores packageVersion('metafor') in every fit; metafopy has no R package version to store."

[[known]]
match = "*"
kind = "missing-field"
path = "*$time"
reason = "R stores the system time the fit took; not a result of the analysis."

[[known]]
match = "*"
kind = "missing-field"
path = "*$verbose"
reason = "R stores the verbose setting the fit was called with; metafopy does not keep it."

[[known]]
match = "*"
kind = "accepts-where-R-refuses"
detail = "R: object 'out' not found*"
reason = "metafor 5.2-1 stops with the internal error \"object 'out' not found\" when options(na.action='na.fail') is set; metafopy gives the result."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "accepts-where-R-refuses"
detail = "R: *did not achieve convergence*"
reason = "R's optimiser stops without convergence on this case and R refuses the fit; metafopy's optimiser converges."

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*ontrol*optimizer*"
reason = "R silently ignores control entries a function does not use (here 'optimizer'); metafopy raises for unknown control entries so a misspelt setting is not lost."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*unexpected arguments:*"
reason = "Plot '...' arguments are explicit keywords; R passes unknown graphical parameters to par() or ignores them."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*unknown dataset*"
reason = "The data sets that are lists of data frames (not tables) are not bundled."
ref = "docs/differences.md"

# Audit 8: optimiser and flat-likelihood differences, each checked against R (the log-likelihoods at the two optima agree or Python's is higher).

[[known]]
match = "*/ls_year"
kind = "value-diff"
reason = "Location-scale fit ~ ablat + year with scale ~ ablat + year: the scale intercept is -151 (tau2 is 0 to machine precision), so the likelihood is flat in the scale coefficients. Log-likelihood -7.602255955 in R and Python, scale coefficients agree to 1e-6, the Wald statistics of the scale part (QS, se.alpha, va) differ by up to 2e-4; R's nlminb itself does not converge when its tolerance is tightened."
ref = "docs/differences.md"

[[known]]
match = "*/ls_year/*"
kind = "value-diff"
reason = "Same fit as ls_year above (flat scale intercept); every option variant refits it."
ref = "docs/differences.md"

[[known]]
match = "*/ls_na"
kind = "value-diff"
reason = "Location-scale fit ~ year with scale ~ ablat on data with missing values: scale intercept -10.4 and a boundary tau2, log-likelihood -4.194072548 in R and Python, scale coefficients agree to 1e-5, QS and the Wald statistics of the scale part to 2e-4; R's nlminb does not converge when its tolerance is tightened."
ref = "docs/differences.md"

[[known]]
match = "*/ls_na/*"
kind = "value-diff"
reason = "Same fit as ls_na above (flat scale intercept); every option variant refits it."
ref = "docs/differences.md"

[[known]]
match = "construct/ls_*/control=*"
kind = "value-diff"
reason = "Each R optimiser (nlminb, Nelder-Mead, BFGS, nmk, nloptr, BBoptim, Rcgmin, Rvmmin, lbfgsb3c) stops at a different point of a flat likelihood: for ls_year and ls_na the log-likelihoods of R's optimisers agree to 1e-6 (-7.6022559 and -4.1940725) and Python's is as high, but the coefficients differ between R's own optimisers by as much as they differ from Python's."
ref = "docs/differences.md"

[[known]]
match = "*/ls_*"
kind = "value-diff"
path = "[]*"
reason = "profile() of the flat location-scale fits ls_na, ls_year and ls_bcg: at grid points far from the estimate the refits are on a flat or degenerate surface (scale factors of exp(-100)); R's and Python's optimisers end at different local points (R's log-likelihood is 36 lower at one grid point of ls_na, Python's 25 lower at another)."
ref = "docs/differences.md"

[[known]]
match = "*/permutest/ls_*"
kind = "value-diff"
reason = "permutest() of location-scale fits refits the model for every permutation, on the flat likelihood of ls_na, ls_bcg and ls_bangert (see above); the permutation distribution of the scale coefficients inherits the optimiser noise."
ref = "docs/differences.md"

[[known]]
match = "*/permutest_ls*"
kind = "value-diff"
reason = "Same as permutest/ls_*: refits of a flat location-scale likelihood."
ref = "docs/differences.md"

[[known]]
match = "*/mv_sp*"
kind = "value-diff"
reason = "rma_mv with the spatial structure SPEXP (~ year | district) on dat.konstantopoulos2011: the range rho is flat. REML log-likelihood -31.91350753 and tau2 0.0812804 agree in R and Python to 1e-8, but rho is 0.05592 (R nlminb), 0.05596 (Python) and 0.03527 (R Nelder-Mead) at that same log-likelihood; with year as moderator Python's rho is 0.0437 against R's 0.0549 at log-likelihood -31.2005931 in both."
ref = "docs/differences.md"

[[known]]
match = "construct/mv_ks/control=*"
kind = "value-diff"
reason = "rma_mv ~ 1 | district/school fitted with another optimiser: sigma2 of the school level agrees to 1e-3 at equal REML log-likelihood; the derivative-free optimisers stop on rel.tol, and R's own optimisers differ from each other by the same amount."
ref = "docs/differences.md"

[[known]]
match = "matrix/dfbetas/mv_ks_mods"
kind = "value-diff"
reason = "dfbetas() of an rma_mv fit refits the model without each cluster; the values are 6e-4 and differ by 2e-7 (absolute), the noise of the refits' optimum."
ref = "docs/differences.md"

[[known]]
match = "matrix/*/mv_wide"
kind = "value-diff"
reason = "mv_wide has variance components at the boundary (around 1e-5), so the BLUPs and predictions are 1e-3 relative different in values of the order 1e-5 to 1e-3 (absolute differences 1e-8 to 6e-7)."
ref = "docs/differences.md"

[[known]]
match = "matrix/*/mv_gen"
kind = "value-diff"
reason = "confint() and profile() of the unstructured (GEN) rma_mv fit: the confidence limits of the variance components run to a flat part of the likelihood (6900 against 7700) and the profile likelihood is evaluated at points where the optimisers end differently."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_bcg*"
kind = "value-diff"
reason = "rma_glmm(model='UM.FS') (and mods) fitted by lme4 in R and by the port in Python: the objective is the same (at R's coefficients Python's deviance is 4e-6 above its own optimum) but the surface is flat. For the intercept of ~ alloc at nAGQ = 7 R's bobyqa gives -0.61510, R's Nelder-Mead -0.61554 and Python -0.61456; coefficients agree to 1e-3 and standard errors to 2e-3."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_rs*"
kind = "value-diff"
reason = "rma_glmm(model='UM.RS'): R log-likelihood -126.2962883, Python -126.2962773 (higher); coefficients differ by 1e-4 and standard errors by 4e-3 relative because R's glmer stops early on a flat surface."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_cm*"
kind = "value-diff"
reason = "rma_glmm(model='CM.EL'): R's Hessian is a finite-difference one of a noisy objective, see docs/differences.md."
ref = "docs/differences.md"

[[known]]
match = "scripts/*"
kind = "value-diff"
detail = "*rma.glmm*"
reason = "rma.glmm calls in R's own examples and tests: lme4 or the noisy CM.EL objective of R stops at a different point of a flat surface, see the rma_glmm entries."
ref = "docs/differences.md"

[[known]]
match = "options/forest/*"
kind = "value-diff"
path = "$cex*"
reason = "forest() of a model with many studies lowers cex to fit the figure height: R divides by strheight('O') on its 7 x 7 inch pdf device (0.6399 for the 56 studies of dat.konstantopoulos2011) and metafopy by the height of the matplotlib axes, which depends on the figure the caller made (0.5309 for the default figure)."
ref = "docs/differences.md"

[[known]]
match = "matrix/[/vcalc_ks"
kind = "shape-diff"
reason = "x[i] with one index on a matrix: R indexes the elements (3 values for c(1,2,3)), numpy selects rows; metafopy keeps numpy's meaning."
ref = "docs/differences.md"

[[known]]
match = "scripts/*"
kind = "value-diff"
detail = "*scale = ~*"
reason = "Location-scale fits of R's tests with several scale terms (scale = ~grade + meta + sqrt(ni)): the likelihood is flat in the scale coefficients; they agree with R to 1e-3 and the Wald statistics of the scale part to 2e-3."
ref = "docs/differences.md"

[[known]]
match = "scripts/*"
kind = "value-diff"
detail = "*rma.mv(*control = list(optimizer*"
reason = "rma.mv fitted with each of R's optimisers in the tests (BFGS, L-BFGS-B, Nelder-Mead, uobyqa ...): they stop at different points of a flat REML surface, 3e-4 apart in the marginal variances, and Python's optimiser is not R's."
ref = "docs/differences.md"
