# Differences that are accepted, each with its reason and where docs/differences.md records it. A finding that matches an entry is left out of the
# report; an entry that matches nothing in a full run is stale and is reported, so this file cannot outlive the difference it records.
# `match` is a glob on the case id, `kind` and `path` are globs (default `*`).

[[known]]
match = "matrix/summary/*"
kind = "missing-field"
reason = "summary() returns the printed text; the fields of R's summary object are the fields of the fit, which the fit cases compare."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_bcg"
kind = "value-diff"
path = "$[pQ]*"
reason = "rma_glmm(measure='OR', model='UM.FS') zval -4.2436 against R's -4.2434; untraced."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_bcg"
kind = "print-diff"
reason = "rma_glmm mixed-model fits agree with R to between 2e-3 and 1e-1 relative; see the rma_glmm entries."
ref = "docs/differences.md"

[[known]]
match = "matrix/gosh/*"
reason = "gosh(seed=) is bit-exact with R only where dbinom ties break the same way (R 4.5.1 on Linux); this oracle is R 4.3.3."
ref = "docs/differences.md"

[[known]]
match = "matrix/plot/gosh_*"
kind = "type-diff"
reason = "plot() of a gosh result returns the value of R's last graphics call (a number); metafopy returns the axes drawn (PlotGoshResult)."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_cm*"
kind = "print-diff"
reason = "Same as the value-diff entry: the printed Wald test of the saturated model (QE_Wld) of CM.EL differs."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_cm*"
kind = "warning-missing"
detail = "Cannot invert the Hessian for the saturated model.*"
reason = "R cannot invert the noisy Hessian of the saturated CM.EL model and gives NA for QE_Wld, QE_LRT and QE_df; metafopy's Hessian inverts."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_rs*"
kind = "print-diff"
reason = "Same as the value-diff entry: the printed tests of the UM.RS fit differ in the third decimal."
ref = "docs/differences.md"

[[known]]
match = "matrix/cooks.distance/mv_wide"
kind = "value-diff"
reason = "R's leave-one-out refit of study 18 does not converge and cooks.distance() gives NA there; metafopy's refit converges (value 0.0025)."
ref = "docs/differences.md"

[[known]]
match = "standalone/fmtx/drop0ifint=*"
kind = "value-diff"
reason = "fmtx(drop0ifint=TRUE) drops trailing zeros in R only when digits is an R integer (2L, not 2 or the default); Python has no such distinction, so drop0ifint=True always drops."
ref = "docs/differences.md"

[[known]]
match = "construct/ls_year/optbeta=*"
kind = "value-diff"
path = "$vcovmat"
reason = "The location-scale fit of ls_year has a scale intercept near -151 (tau2 on the boundary): the numerical Hessian is singular in metafopy and just invertible in R; the matrix is noise."

[[known]]
match = "options/vif/ls_bcg/*"
kind = "value-diff"
path = "$alpha*"
reason = "The scale model ~ alloc of ls_bcg is degenerate (alpha estimates of the simulated and re-estimated fits run off to the boundary, R's VIFs are 1e8 or 1e-8); the values cannot be compared."

[[known]]
match = "scripts/misc_anova/*"
kind = "shape-diff"
path = "$QMdf"
reason = "anova(X=) of linear combinations that are not of full rank: R's QMdf is the single NA, metafopy keeps the pair (m, ddf) and gives NaN for QM and QMp."
ref = "docs/differences.md"

[[known]]
match = "scripts/misc_escalc/*"
detail = "*attr(dat$y?, \"measure\")*"
reason = "The attributes of an escalc result (measure, ni, slab) are kept once for the data frame in DataFrame.attrs, not per variable as R keeps them on each yi column, so a second escalc() with other var_names or a cbind() changes them for all."
ref = "docs/differences.md"

[[known]]
match = "scripts/misc_selmodel/*"
kind = "value-diff"
detail = "*optimizer = \"mads\"*"
reason = "selmodel(type='truncest', control=list(optimizer='mads')) on hackshaw1998: R stops at log-likelihood -5.08477, metafopy at -5.08452 (higher), so the estimates differ by 0.5 %; the derivative-free search ends at different points of a flat likelihood."
ref = "docs/differences.md"

[[known]]
match = "scripts/misc_selmodel/*"
kind = "value-diff"
path = "$*"
detail = "*sav <- selmodel(res, type = \"beta\")*"
reason = "selmodel(type='beta') on baskerville2012 (ML, tau2 near 0): R's PORT stops at log-likelihood -2.792404, metafopy at -2.792399 (higher), so tau2 of 2.4e-6 differs by 2.6 % (absolute 6e-8) and the other estimates by 1e-5 relative."
ref = "docs/differences.md"

[[known]]
match = "scripts/misc_coef_se/*"
kind = "value-diff"
detail = "*sel <- selmodel(res, type = \"beta\")*"
reason = "Same as the selmodel(type='beta') entry of misc_selmodel: tau2 near 0 on baskerville2012, the log-likelihood is higher in metafopy."
ref = "docs/differences.md"

[[known]]
match = "*/reporter*"
reason = "reporter() writes an R Markdown report; Jupyter notebooks are the Python equivalent."
ref = "docs/differences.md"

[[known]]
match = "scripts/*"
kind = "crash"
detail = "MissingRFunctionError: reporter*"
reason = "reporter() writes an R Markdown report; Jupyter notebooks are the Python equivalent."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "missing-field"
path = "*$chksum*"
reason = "R keeps checksums of the data to detect changes between refits (chksumX, chksumyi, chksumvi, chksumV); metafopy keeps the arrays themselves."

[[known]]
match = "*"
kind = "missing-field"
path = "*$version"
reason = "R stores packageVersion('metafor') in every fit; metafopy has no R package version to store."

[[known]]
match = "*"
kind = "missing-field"
path = "*$time"
reason = "R stores the system time the fit took; not a result of the analysis."

[[known]]
match = "*"
kind = "missing-field"
path = "*$verbose"
reason = "R stores the verbose setting the fit was called with; metafopy does not keep it."

[[known]]
match = "*"
kind = "accepts-where-R-refuses"
detail = "R: object 'out' not found*"
reason = "metafor 5.2-1 stops with the internal error \"object 'out' not found\" when options(na.action='na.fail') is set; metafopy gives the result."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "accepts-where-R-refuses"
detail = "R: *did not achieve convergence*"
reason = "R's optimiser stops without convergence on this case and R refuses the fit; metafopy's optimiser converges."

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*unknownentry*"
reason = "Reproduced in R: rma() and rma.mv() silently ignore a control entry that no function of metafor reads (the sweep's 'unknownentry'; selmodel() only warns 'unknown names in control'); metafopy raises for it so that a misspelt setting is not lost. Entries that another function of metafor reads (threshold, stepadj, optimizer, ...) are ignored as in R."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*control*'sparse'*"
reason = "Reproduced in R: rma() and rma.mv() silently ignore a control entry that no function of metafor reads ('sparse' is an argument of rma.mv, not a control setting); metafopy raises for it so that a misspelt setting is not lost. Entries that another function of metafor reads (threshold, stepadj, optimizer, ...) are ignored as in R."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*unexpected arguments:*"
reason = "Plot '...' arguments are explicit keywords; R passes unknown graphical parameters to par() or ignores them."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*unknown dataset*"
reason = "The data sets that are lists of data frames (not tables) are not bundled."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "missing-field"
path = "*$data$*"
reason = "res.data is the MetaData of the fit (vectors and matrices used), not the data frame the caller passed."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "shape-diff"
path = "*$data$*"
reason = "res.data holds the studies used in the fit; R's data keeps those with missing values."
ref = "docs/differences.md"

[[known]]
match = "matrix/print/*"
kind = "shape-diff"
path = "$slab"
reason = "slab of the fit has the studies used; R keeps the studies with missing values in slab (the _f fields hold them in metafopy)."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "missing-field"
path = "*$mf.*"
reason = "R keeps the model frames of the random-effects terms (mf.g, mf.h, mf.r, mf.s, ...); metafopy keeps the factors in group."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "missing-field"
path = "*$opt.res"
reason = "R keeps the raw return value of its optimiser; the SciPy result has other fields."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "missing-field"
path = "*$class.f"
reason = "R stores the class of the full model in an anova result; the class of the Python object says so."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "label-diff"
path = "*$coef.na"
reason = "R names coef.na 'X' (a quirk of the code); metafopy names it with the coefficients."
ref = "docs/differences.md"

[[known]]
match = "matrix/print/summary_*"
kind = "missing-field"
reason = "summary() returns the printed text; the fields of R's summary object are the fields of the fit, which the fit cases compare."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "missing-field"
path = "$data"
reason = "cumul(), leave1out() and the results of mv fits do not keep a data frame of the studies (R: data); the vectors and matrices are fields of the fit."
ref = "docs/differences.md"

[[known]]
match = "matrix/print/vif_*"
kind = "missing-field"
path = "$vif$*"
reason = "vif() gives a table of the vifs by coefficient, where R keeps a list with one entry per coefficient."
ref = "docs/differences.md"

[[known]]
match = "matrix/print/anova_*"
kind = "missing-field"
path = "$class"
reason = "The class of the anova result is the class of the Python object."
ref = "docs/differences.md"

[[known]]
match = "matrix/print/robust_*"
kind = "missing-field"
path = "$sandwiches"
reason = "The sandwich matrices of the club-sandwich estimator are kept in the robust result, not on the fit."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "InputError: Unknown 'adjust' value 'holm'."
reason = "R applies no small-sample adjustment for any string other than 'Stata', 'Stata1' and 'Stata2' (so 'holm' silently does nothing); metafopy refuses it."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*Length of 'yi' (56) and the length/dimensions of 'V' (13)*"
reason = "R recycles a vector V through diag(V, nrow = k) and fits; metafopy requires V to match yi."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*'sigma2' argument*does not match the actual number*"
reason = "R ignores a sigma2 vector for a model without sigma2 components; metafopy checks the length."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "*must be a *named* list*"
reason = "R ignores R=NA when the model has no component that uses it; metafopy checks the type."
ref = "docs/differences.md"

[[known]]
match = "standalone/fmtt/*"
kind = "refused-where-R-works"
detail = "*plotmath*"
reason = "fmtt(call=TRUE) returns an R plotmath call, which has no Python counterpart."
ref = "docs/differences.md"

[[known]]
match = "construct/glmm_cm/*"
kind = "refused-where-R-works"
detail = "EstimationError: Cannot compute var-cov matrix of the fixed effects."
reason = "R's CM.EL Hessian is noise here (standard errors of 1e-4, tau2 2e-4, warning 'unusually small'; the ~ablat fit does not converge in R); metafopy refuses to report them."
ref = "docs/differences.md"

[[known]]
match = "*"
kind = "refused-where-R-works"
detail = "InputError: Could not fit the null model."
reason = "R's hettest() does not pass control on when x is a model object (the recursive call drops it), so maxiter has no effect there; metafopy applies it."
ref = "docs/differences.md"

[[known]]
match = "matrix/anova/*"
kind = "accepts-where-R-refuses"
detail = "R: Class of*"
reason = "The anova() method of selection-model fits is an extension: it compares a selection model with a plain fit, where R stops with 'Class of object must be the same'."
ref = "docs/differences.md"

[[known]]
match = "matrix/$<-/*"
kind = "missing-field"
detail = "*has no field zz"
reason = "A result is an immutable dataclass: x$zz <- 1 (a new element) has no counterpart; the elements that exist are replaced with dataclasses.replace."

# Audit 8: optimiser and flat-likelihood differences, each checked against R (the log-likelihoods at the two optima agree or Python's is higher).

[[known]]
match = "*/ls_*"
kind = "value-diff"
path = "[]*"
reason = "profile() of the flat location-scale fits ls_na, ls_year and ls_bcg: at grid points far from the estimate the refits are on a flat or degenerate surface (scale factors of exp(-100)); R's and Python's optimisers end at different local points (R's log-likelihood is 36 lower at one grid point of ls_na, Python's 25 lower at another)."
ref = "docs/differences.md"

[[known]]
match = "matrix/dfbetas/mv_ks_mods"
kind = "value-diff"
reason = "dfbetas() of an rma_mv fit refits the model without each cluster; the values are 6e-4 and differ by 2e-7 (absolute), the noise of the refits' optimum."
ref = "docs/differences.md"

[[known]]
match = "matrix/*/mv_gen"
kind = "value-diff"
reason = "confint() and profile() of the unstructured (GEN) rma_mv fit: the confidence limits of the variance components run to a flat part of the likelihood (6900 against 7700) and the profile likelihood is evaluated at points where the optimisers end differently."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_rs*"
kind = "value-diff"
reason = "rma_glmm(model='UM.RS'): R log-likelihood -126.2962883, Python -126.2962773 (higher); coefficients differ by 1e-4 and standard errors by 4e-3 relative because R's glmer stops early on a flat surface."
ref = "docs/differences.md"

[[known]]
match = "*/glmm_cm*"
kind = "value-diff"
reason = "rma_glmm(model='CM.EL'): R's Hessian is a finite-difference one of a noisy objective, see docs/differences.md."
ref = "docs/differences.md"

[[known]]
match = "matrix/[/vcalc_ks"
kind = "shape-diff"
reason = "x[i] with one index on a matrix: R indexes the elements (3 values for c(1,2,3)), numpy selects rows; metafopy keeps numpy's meaning."
ref = "docs/differences.md"

[[known]]
match = "scripts/*"
kind = "value-diff"
detail = "*rma.mv(*control = list(optimizer*"
reason = "rma.mv fitted with each of R's optimisers in the tests (BFGS, L-BFGS-B, Nelder-Mead, uobyqa ...): they stop at different points of a flat REML surface, 3e-4 apart in the marginal variances, and Python's optimiser is not R's."

