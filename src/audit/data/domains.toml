# Values the option sweep gives an argument, by argument name. A value is JSON (TOML inline tables spell the `$` tags in quotes).
# Where an argument has a default that is TRUE or FALSE the sweep tries the other one; where it is a choice of strings (or the body compares it
# with constants) every choice is tried; this file covers the rest. An argument that is neither here, nor derived, nor listed under [skip]
# is reported as uncovered, and test_universe_accounts fails on it.

