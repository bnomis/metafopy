"show.signif.stars" = [false]

[options_skip]
metafor = "package settings read through getmfopt(); setmfopt() would leak state between cases"
browser = "the browser that opens help pages"

[graphics]
# Arguments the plotting functions pass to R's graphics functions through `...`; a function that draws and has `...` is also swept with these.
names = ["bty", "las", "xaxt", "yaxt", "cex", "lwd", "lty", "col", "pch", "bg", "main", "xlab", "ylab", "xlim", "ylim", "cline", "addgrid", "layout", "legend"]

[alias]
# R argument names that metafopy spells differently (beyond dots to underscores)
clubSandwich = "club_sandwich"

[fns.dfround.args]
# one digits value per column of a data frame, with missing entries
digits = [2, [2, { "$na" = true }, 1, 0, 3, { "$na" = true }, 2, 2, 2, 2, 2, 2, 2]]

# arguments that only make sense together: when the key is swept, the arguments under it are set too (labels for the ticks need the ticks)
[companions."at.lab"]
at = [-2, -1, 0, 1, 2]
