# The recall corpus: every item the audits of 2026-10-15 and 2026-10-16 found by hand, with the finding the harness must produce for it.
#
# `bin/metafor-audit.sh --recall` runs the harness against metafopy as it was when each audit looked (the commit under [audit.N]) with the ledger
# switched off and reports, per audit, which items it reproduced. An item is reproduced when some finding matches a `find` entry: globs on `id`, `kind`,
# `path` and `detail` (default `*`). `hint` lists substrings of case ids (or script topics) that are enough to re-run only the cases involved.
# `reach = "none"` marks an item no probe can see by design, with the reason in `why`; those count as missed in the totals, never as hits.
# Items from the audit reports themselves are quoted in `text`.

[audit.4]
commit = "9f165e1"
report = "/mnt/project-files/reviews/audit4-wrong-or-missing.md"

[audit.5]
commit = "f4ce32f"
report = "/mnt/project-files/reviews/audit5-wrong-or-missing.md"

[audit.6]
commit = "9f61ddf"
report = "/mnt/project-files/reviews/audit6-wrong-or-missing.md"

