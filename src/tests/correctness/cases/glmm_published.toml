# Correctness cases for rma_glmm: published cases; see agents/specs/correctness-glmm/spec.md
#
# Jackson et al. (2018), Table 4: the log odds ratio, its standard error and tau2 of the models rma_glmm fits (Model 4 is UM.FS, Model 5 UM.RS, Model 7
# CM.EL), on the Table 3 data. Models 1 (rma_uni), 2, 3 and 6 are not fits of rma_glmm, so they have no case. The paper computed Table 4 with metafor 1.9-9
# and lme4 1.1-12; a value that differs from metafopy by more than half a unit of its last printed digit is a mismatch case beside the case of the values
# that agree. "Outcome 4" includes the double-zero study (drop00 = false) and "outcome 4b" drops it (drop00 = true, the default). The paper prints a
# tau2 of 0 as "0", whose tolerance is 0.5; the derived cases check the boundary tightly. Outcome 4, Model 7 is the starred fit of Section 5.2
# (Nelder-Mead, maxit 20000, reltol 1e-4).
#
# Sources with formulas only, and so no published case: Pinheiro and Bates (1995) and Breslow (1981) print no worked example this suite uses, and
# Higgins and Thompson (2002) is a formula for the typical within-study variance (covered by the heterogeneity cases of the derived kind).
#
# Other sources: Stijnen et al. (2010) Tables II, III, VII and VIII (the bivariate and trivariate models and the network model are not rma_glmm fits);
# van Houwelingen et al. (1993) Sections 3 and 4 (the paper models control against treatment, so the sign is reversed; its bivariate and non-parametric fits
# are not rma_glmm fits); Simmonds and Higgins (2016) Fig 1 (the BCG and network examples are not written: the paper prints no tau2 or standard error, and its
# BCG tables give odds ratios to two or three decimals only);Turner et al. (2000) fixed-effect rows of Tables III and IV (its random-effects rows are quasi-likelihood
# fits in MLwiN, not maximum likelihood, so they are not compared); Hamza et al. (2008) Table 3, exact method. Zhou et al. (1999): Table IV prints the
# weighted average, GEE and CIHM estimates on the proportion scale, none a generalised linear mixed model, so no case. Bagos and Nikolopoulos (2009) prints
# no per-study data: listed under "Sources needed" in agents/specs/correctness-glmm/mismatches.md.
# Task 11 read the two reviews it uses (Hooper et al. 2001; Wolf et al. 2003) and found no per-study counts and person-time that reproduce its Table 5, so it has
# no case either: see the same entries.

[[case]]
id = "glmm.published.jackson2018.table4.model4.outcome1"
kind = "published"
function = "rma_glmm"
data = { ai = [1, 0, 1, 13, 2, 4, 6], bi = [155, 89, 43, 64, 157, 43, 76], ci = [12, 3, 6, 27, 5, 6, 0], di = [69, 40, 32, 53, 165, 43, 148] }
args = { ai = "ai", bi = "bi", ci = "ci", di = "di", measure = "OR", model = "UM.FS", method = "ML", drop00 = true }
expect = { "beta[0]" = "-1.024", "se[0]" = "0.708" }
covers = ["rma_glmm.fit.OR.UM.FS.ML"]

[case.source]
citation = "Jackson D, Law M, Stijnen T, Viechtbauer W, White IR (2018). A comparison of seven random-effects models for meta-analyses that estimate the summary odds ratio. Stat Med 37(7):1059-1085"
doi = "10.1002/sim.7588"
locator = "Table 4, Model 4, outcome 1; data of Table 3, outcome 1 (pneumonia)"
read = 2026-11-14

