# Proof of the property path: I2 is H2 expressed as a share of the total variability, I2 = 100 (H2 - 1) / H2.
[[case]]
id = "heterogeneity.i2-from-h2.dl.bcg"
kind = "property"
function = "rma_uni"
dataset = "dat.bcg"
setup = { escalc = { measure = "RR", ai = "tpos", bi = "tneg", ci = "cpos", di = "cneg" } }
args = { yi = "yi", vi = "vi", method = "DL" }
expect = {}
check = "test_properties.i2_follows_h2"

# A model without an intercept: QE is Cochran's Q, y' P y, with no centring of y first. metafopy centres y, which changes QE when the columns of X do not
# span the constant (Task 2 of agents/tasks/qe-no-intercept/tasks-1.md fixes it).
[[case]]
id = "heterogeneity.qe.bangertdrowns.nointercept"
kind = "derived"
function = "rma_uni"
dataset = "dat.bangertdrowns2004"
args = { yi = "yi", vi = "vi", method = "DL", mods = "~ ni", intercept = false }
expect = { QE = "formulas.rma_QE" }
status = "mismatch"
reason = "metafopy centres yi, so its QE is 95.13523; Cochran's y' P y on yi gives 135.99842"
covers = ["heterogeneity.QE"]
