# The estimating equations at metafopy's optimum, sigma2 components only.
[[case]]
id = "property.mv.reml-score.kon"
kind = "property"
function = "rma_mv"
dataset = "dat.konstantopoulos2011"
args = { yi = "yi", V = "vi", random = "~ 1 | district/school", mods = "~ year", method = "REML" }
expect = {}
# relative to the score's scale tr(P Z Z'): the Newton polish of mv_opt ends the fit at a relative score of at most 8.6e-12 on the development Mac
# from every BFGS stop measured (default, gtol 1e-12, 1e-5 and 1e-4, maxiter 4), times 10 and rounded up (the margin rule of
# agents/specs/cross-platform-numerics/spec.md); measured 2026-11-17, agents/specs/rma-mv-reml-stop/spec.md
tolerance = 1e-10
check = "test_properties.mv_score_is_zero"

