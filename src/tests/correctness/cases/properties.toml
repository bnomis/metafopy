dataset = "dat.konstantopoulos2011"
args = { yi = "yi", V = "vi", random = "~ 1 | district/school", sigma2 = [nan, 0.0], method = "REML" }
expect = {}
check = "test_properties.mv_zero_component_equals_reduced_model"

# Two inner levels: UN and HCS are the same model (two variances, one correlation).
