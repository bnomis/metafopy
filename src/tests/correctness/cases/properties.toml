kind = "property"
function = "rma_mv"
dataset = "dat.tannersmith2016"
setup = { vconst = { cluster = "studyid", vi = "vi", rho = 0.6 } }
args = { yi = "yi", random = "~ 1 | studyid", sigma2 = [0.05], mods = "~ propmale", method = "REML" }
expect = {}
check = "test_properties.cr2_is_unbiased_under_the_working_model"
then = { function = "robust", args = { cluster = "studyid", club_sandwich = true, vcov = "CR2" } }

