# rma_mv properties. The checks live in `test_properties.py`; each is an identity or invariance the model guarantees, so none needs a reference value.

# One row per id: the model ~ 1 | id is the random-effects model of rma_uni.
[[case]]
id = "property.mv.one-row-per-id.bcg"
kind = "property"
function = "rma_mv"
dataset = "dat.bcg"
setup = { escalc = { measure = "RR", ai = "tpos", bi = "tneg", ci = "cpos", di = "cneg" } }
args = { yi = "yi", V = "vi", random = "~ 1 | trial", mods = "~ ablat", method = "REML" }
expect = {}
check = "test_properties.mv_one_row_per_id_equals_uni"

# A zero sigma2 adds nothing to the marginal covariance: fixing the school level at 0 gives the district-only model.
[[case]]
