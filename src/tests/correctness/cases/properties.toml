id = "property.robust.cr0-hc0.plain"
kind = "property"
function = "rma_uni"
dataset = "dat.bcg"
setup = { escalc = { measure = "RR", ai = "tpos", bi = "tneg", ci = "cpos", di = "cneg" } }
args = { yi = "yi", vi = "vi", method = "REML", mods = "~ ablat" }
expect = {}
check = "test_properties.cr0_with_singleton_clusters_is_hc0"
then = { function = "robust", args = { cluster = "trial", adjust = false } }

[[case]]
id = "property.robust.cr0-hc0.club"
kind = "property"
