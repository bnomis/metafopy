# Other-software cases for rma_glmm from base R's mantelhaen.test and glmmML, written by src/tests/correctness/r/other_software_glmm.R; do not
# edit by hand.
#
# mantelhaen.test(exact = TRUE) and glmmML do not depend on metafor or lme4, so these values are independent of them. glmmML integrates by plain
# Gauss-Hermite quadrature; see the script for the conventions it pins.

[[case]]
id = "other.glmm.cm.el.fe.nielweise2007"
kind = "other"
function = "rma_glmm"
dataset = "dat.nielweise2007"
args = { ai = "ai", n1i = "n1i", ci = "ci", n2i = "n2i", measure = "OR", model = "CM.EL", method = "FE" }
expect = { "beta[0]" = -1.2235589235652995 }
tolerance = 1.0000000000000001e-05

[case.source]
citation = "stats::mantelhaen.test(exact = TRUE), base R, run on R 4.6.2"
locator = "mantelhaen.test(array of 2 x 2 tables, exact = TRUE)$estimate, the conditional maximum likelihood estimate of the common odds ratio, on the log scale; the exact interval is not compared (metafopy gives a Wald interval)"
read = 2026-11-14
url = "https://stat.ethz.ch/R-manual/R-devel/library/stats/html/mantelhaen.test.html"

