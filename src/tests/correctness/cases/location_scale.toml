# Correctness cases for location-scale models (rma_uni with scale): published and derived cases; see agents/specs/correctness-location-scale/spec.md
#
# Sources: Viechtbauer and Lopez-Lopez (2022), doi:10.1002/jrsm.1562 (printed values, kind published); formulas in correctness.formulas (kind derived);
# R glmmTMB (kind other). Two decisions of the spec: the paper's printed values count as published, and every location-scale item needs a derived
# case as well, so the file sets derived_required below.

derived_required = ["ls."]

# Task 4 of agents/tasks/correctness-location-scale/tasks-1.md: the fits, the fit statistics and the heterogeneity statistics, each against
# formulas.ls_reference_fit (BFGS and Nelder-Mead on the likelihood of equations 7 and 9, with the identity link constrained to tau2_i >= 0).
# Datasets: dat.bangertdrowns2004 with the moderator imag in both parts, dat.bcg (log risk ratio) with ablat in both parts. The identity-link fits
# are polished on the analytic score within tau2_i >= 0 (R's constrOptim stops about 1e-5 short of the maximum there, see
# agents/specs/correctness-location-scale/mismatches.md and docs/differences.md).
# ls.optbeta takes its method from the case (see the check ls_optbeta). The deviance of ls.fitstats.* is not compared: the paper defines none, so only the
# log-likelihood, AIC, BIC and AICc are. QE is Cochran Q with the inverse-variance weights, not the quadratic form at the fitted tau2_i. The inline
# columns of ls.heterogeneity.bdni are dat.bangertdrowns2004 yi and vi, with ni100 = ni / 100 (the rescaling the paper's authors apply to total sample size);
# test_formulas_ls.py checks them against the dataset.

[[case]]
id = "ls.fit.ML.log.bd"
kind = "derived"
function = "rma_uni"
dataset = "dat.bangertdrowns2004"
args = { yi = "yi", vi = "vi", mods = "~ imag", scale = "~ imag", method = "ML", link = "log" }
check = "test_derived.ls_fit"
covers = ["ls.fit.ML.log"]

[[case]]
id = "ls.fit.ML.identity.bd"
kind = "derived"
function = "rma_uni"
dataset = "dat.bangertdrowns2004"
