# Task 5 of agents/tasks/correctness-location-scale/tasks-1.md: the tests, the covariance and omnibus test of the scale part and both kinds of
# interval, against formulas.ls_reference_fit with the log link (the identity link is polished to the maximum, see the note above).
# The scale covariance is compared with the inverse of the analytic observed information, so its tolerance is that of metafopy's numerical Hessian.

