# Correctness cases for rma_mv; see agents/specs/correctness-mv-robust/spec.md
#
# `derived` cases: the `mv_model` check (test_derived.py) builds y, V, X and the random-effects terms from the case and compares metafopy's fit with
# `formulas.mv_loglik`, the generalised least squares formula and `formulas.mv_fit`, coded from Harville (1977) and Wolfinger (1993).
# Conventions of the software, not of the papers: the REML constant log|X'X| (as metafor's default REMLf), and the order of the UN correlations.

[[case]]
id = "mv.method.ee.kon"
kind = "derived"
function = "rma_mv"
dataset = "dat.konstantopoulos2011"
args = { yi = "yi", V = "vi", method = "EE" }
check = "test_derived.mv_model"
covers = ["rma_mv.method.EE"]

[[case]]
id = "mv.method.fe.kon"
kind = "derived"
function = "rma_mv"
dataset = "dat.konstantopoulos2011"
args = { yi = "yi", V = "vi", method = "FE", mods = "~ year" }
check = "test_derived.mv_model"
covers = ["rma_mv.method.FE"]

