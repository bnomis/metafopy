# club_sandwich cases: the `robust_club` check (test_derived.py) rebuilds the working model of the fit (Theta its marginal covariance, W its inverse)
# and compares the `robust(club_sandwich=True)` result with `formulas.cluster_robust_vcov`, `satterthwaite_dfs`, `saddlepoint_pvalue` and
# `hotelling_wald`, coded from Tipton and Pustejovsky (2015), Pustejovsky and Tipton (2018) and Kuonen (1999); never from `metafopy.core.clubsandwich`.

[[case]]
id = "robust.club.vcov.CR0"
kind = "derived"
function = "rma_mv"
dataset = "dat.tannersmith2016"
setup = { vconst = { cluster = "studyid", vi = "vi", rho = 0.6 } }
args = { yi = "yi", random = "~ 1 | studyid", mods = "~ aget1 + aget2", method = "REML" }
check = "test_derived.robust_club"
covers = ["robust.vcov.CR0"]
then = { function = "robust", args = { cluster = "studyid", club_sandwich = true, vcov = "CR0" } }

[case.source]
citation = "Pustejovsky JE, Tipton E (2018). Small-sample methods for cluster-robust variance estimation and hypothesis testing in fixed effects models. Journal of Business and Economic Statistics 36:672-683"
locator = "section 2, equation 4 with A_j = I (Liang and Zeger 1986)"
read = 2026-11-14
doi = "10.1080/07350015.2016.1247004"

