# Published selection-model cases (Task 9 of the publication-bias task list). Values are written as printed; each source's data were checked against the bundled
# dataset before the case was written (the same studies and the same unadjusted estimate to the printed digits). Preston et al. (2004) prints no
# selection-model estimate that maps to metafor's parameters, so its cases are the unadjusted and trim-and-fill figures; Citkowicz and Vevea (2017) is the
# authors' own supplementary code run on its Table 1 data (the 2017 article itself was not available).

[[case]]
id = "published.vevea2005.cohen1981.unadjusted.beta"
kind = "published"
function = "rma_uni"
dataset = "dat.cohen1981"
setup = { escalc = { measure = "ZCOR", ri = "ri", ni = "ni" } }
args = { yi = "yi", vi = "vi", method = "ML" }
expect = { "beta[0]" = "0.38", "tau2" = "0.001" }
covers = ["selmodel.LRT"]

[case.source]
citation = "Vevea JL, Woods CM (2005). Publication bias in research synthesis: sensitivity analysis using a priori weight functions. Psychological Methods 10(4):428-443."
locator = "Table 2, row No selection (transformed correlation 0.38, variance component 0.001), after Fisher r-to-z"
read = 2026-11-15
doi = "10.1037/1082-989X.10.4.428"

