# Parametric and truncation types: `formulas.parametric_weight` (Citkowicz and Vevea 2017 for `beta`; Preston et al. 2004 for `halfnorm`, `negexp`,
# `logistic` and `power`; metafor's `?selmodel` help for `negexppow`) and `formulas.truncation_loglik` (metafor's `?selmodel` help, 5.2-1, for `trunc` and `truncest`), each maximised by
# `test_derived.selmodel_fit`. The continuous types pass `intCtrl.rel.tol = 1e-12`: metafor integrates the weighted density to a relative
# error of 1.2e-4 by default, which moves the log-likelihood by up to 5e-4 for `beta`, whose weight has kinks at the cut-off p-values; the default
# is covered by the R parity fixtures. `halfnorm` and `logistic` have a likelihood flat in `delta` (ll within 1e-8 over a change of 7e-4), hence 2e-3.

[[case]]
id = "selmodel.beta.bangertdrowns2004"
kind = "derived"
function = "selmodel"
dataset = "dat.bangertdrowns2004"
setup = { rma_uni = { method = "ML" } }
args = { type = "beta", control = { intCtrl = { "rel.tol" = 1e-12 } } }
expect = {}
check = "test_derived.selmodel_fit"
tolerance = 1e-4
covers = ["selmodel.beta"]

[[case]]
id = "selmodel.halfnorm.bangertdrowns2004"
kind = "derived"
function = "selmodel"
dataset = "dat.bangertdrowns2004"
setup = { rma_uni = { method = "ML" } }
args = { type = "halfnorm", control = { intCtrl = { "rel.tol" = 1e-12 } } }
expect = {}
check = "test_derived.selmodel_fit"
tolerance = 2e-3
covers = ["selmodel.halfnorm"]

