[[case]]
id = "selmodel.prec.sei.bangertdrowns2004"
kind = "derived"
function = "selmodel"
dataset = "dat.bangertdrowns2004"
setup = { rma_uni = { method = "ML" } }
args = { type = "stepfun", steps = [0.025, 0.50, 1.0], prec = "sei" }
expect = {}
check = "test_derived.selmodel_fit"
tolerance = 1e-4
status = "mismatch"
reason = "metafopy gives beta 0.13780357 and ll -4.1029, the maximum of the density with weights delta[j] / preci gives beta 0.10568606 and ll -17.4217: metafopy (as metafor 5.2-1 does, see the stepfun prec fixture hack_stepfun_sei) normalises the first interval with weight 1 but weights the observed p-value by delta[0] / preci, so the likelihood is not a density and its maximum moves with the precision measure; no publication defines a precision measure for step functions and metafor warns that it is undocumented and experimental; answered investigate 2026-11-15, see the TODO.md item on a precision measure on a step-function selection model"
covers = ["selmodel.prec.sei"]

