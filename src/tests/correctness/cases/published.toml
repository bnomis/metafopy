# Drafts for group A: Knapp and Hartung (2003), Higgins and Thompson (2002). Sidik and Jonkman (2005) prints no data (see A.md).

# Knapp and Hartung (2003), BCG vaccine trials of Table I (the data of dat.bcg; the latitude of trial 9 is used in absolute value, as in the paper's
# Figure 1 and Section 4). The paper computes yi and the "usual" within-trial variance by equations (19) and (20), which add 0.5 to each cell AND to
# each group size (a + 0.5)/(n + 0.5), not 1 as escalc's add = 0.5 does; so yi and vi are given as columns here, computed from the counts of Table I
# by those equations. The smoothed variance is equation (21). x is the absolute latitude minus its mean (33.4615). The paper's "t-score" is the
# coefficient divided by its standard error (zval), with the usual standard error (test = "z") or the Knapp-Hartung one (test = "knha").

