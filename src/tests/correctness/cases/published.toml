# Higgins and Thompson (2002), the sclerotherapy example (19 trials, log odds ratio). The paper prints no study data, only k, Q, tau2 and I2 in its Table I.
# The counts are the sclerotherapy and control arms of the 19 trials of dat.pagliaro1992 (Pagliaro et al., the paper's reference 8) that have both arms;
# that these are the paper's trials is confirmed by the printed values reproduced here (k = 19, Q = 81.5, tau2 = 0.98, I2 = 78). Lacking a stated
# arm label or outcome in the paper, treat the data identification as a lead checked only by those four numbers. The DL estimator gives the printed
# heterogeneity variance. escalc's default add = 1/2 for the zero cells (trials with a zero count) gives the printed Q.
[[case]]
id = "published.higgins2002.sclerotherapy"
kind = "published"
function = "rma_uni"
data = { ai = [9.0, 13.0, 4.0, 3.0, 5.0, 5.0, 3.0, 11.0, 19.0, 17.0, 10.0, 12.0, 0.0, 13.0, 31.0, 20.0, 3.0, 3.0, 6.0], bi = [33.0, 60.0, 14.0, 32.0, 51.0, 11.0, 20.0, 38.0, 34.0, 36.0, 61.0, 29.0, 21.0, 20.0, 112.0, 35.0, 10.0, 18.0, 16.0], ci = [13.0, 13.0, 0.0, 22.0, 30.0, 6.0, 9.0, 31.0, 9.0, 26.0, 29.0, 14.0, 3.0, 14.0, 23.0, 19.0, 12.0, 5.0, 2.0], di = [28.0, 59.0, 19.0, 14.0, 23.0, 12.0, 13.0, 15.0, 51.0, 34.0, 40.0, 27.0, 17.0, 21.0, 115.0, 32.0, 4.0, 23.0, 22.0] }
setup = { escalc = { measure = "OR", ai = "ai", bi = "bi", ci = "ci", di = "di" } }
args = { yi = "yi", vi = "vi", method = "DL" }
expect = { QE = "81.5", tau2 = "0.98", I2 = "78" }
covers = ["tau2.DL", "heterogeneity.QE", "heterogeneity.I2"]

[case.source]
citation = "Higgins JPT, Thompson SG (2002). Quantifying heterogeneity in a meta-analysis. Statistics in Medicine 21:1539-1558."
doi = "10.1002/sim.1186"
locator = "Table I, sclerotherapy column (number of trials, heterogeneity variance, Q, I2 point value)"
read = 2026-11-12

