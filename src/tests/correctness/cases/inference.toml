# Correctness cases for rma_uni inference: the tests (coverage items `test.<name>`), the tau2 confidence intervals (`confint.<type>`) and prediction
# intervals (`predict.pi`).
#
# `derived` cases on dat.bcg (log risk ratio) under the REML and DL fits, with and without the moderator `ablat`. The coefficient tests and
# intervals come from `formulas.rma_zval` and its siblings, coded from the Wald and Knapp-Hartung (2003) equations; the intervals for tau2 and the
# prediction intervals are compared by the `check` functions of `test_derived.py`, which call `metafopy.confint` and `metafopy.predict` on the fit.

[[case]]
id = "test.z.reml.bcg.none"
kind = "derived"
function = "rma_uni"
dataset = "dat.bcg"
setup = { escalc = { measure = "RR", ai = "tpos", bi = "tneg", ci = "cpos", di = "cneg" } }
args = { yi = "yi", vi = "vi", method = "REML", test = "z", control = { threshold = 1e-13, tol = 1e-13, maxiter = 1000, tau2_max = 1e6 } }
expect = { zval = "formulas.rma_zval", pval = "formulas.rma_pval", ci_lb = "formulas.rma_ci_lb", ci_ub = "formulas.rma_ci_ub" }
covers = ["test.z"]

[[case]]
id = "test.z.reml.bcg.ablat"
kind = "derived"
function = "rma_uni"
dataset = "dat.bcg"
setup = { escalc = { measure = "RR", ai = "tpos", bi = "tneg", ci = "cpos", di = "cneg" } }
args = { yi = "yi", vi = "vi", method = "REML", test = "z", mods = "~ ablat", control = { threshold = 1e-13, tol = 1e-13, maxiter = 1000, tau2_max = 1e6 } }
expect = { zval = "formulas.rma_zval", pval = "formulas.rma_pval", ci_lb = "formulas.rma_ci_lb", ci_ub = "formulas.rma_ci_ub" }
covers = ["test.z"]

