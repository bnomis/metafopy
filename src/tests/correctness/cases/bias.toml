# fsn: the criteria of Rosenthal (1979), Becker (2005), Orwin (1983), Rosenberg (2005) and Viechtbauer (2024, SRSM talk), as `formulas.fsn_*`: the fail-safe
# N is the least number of added null studies that reaches the criterion. The egger2001 cases leave out the two studies the talk leaves out (rows 8 and 16, a
# very small study and ISIS-4) and use its `add = 1/2, to = "all"` log risk ratios, so the talk's printed values (Rosenthal 138, Orwin 119 for the target
# log(0.95), Rosenberg 69, General 29) are the values these cases reproduce. The General type is compared at `exact = true`: the file-drawer studies are
# standardised, so the refitted model does not depend on the random draw. The faster approximation (`exact = false`) is not derived.
[[case]]
id = "bias.fsn.egger2001.rosenthal.stouffer"
kind = "derived"
function = "fsn"
dataset = "dat.egger2001"
setup = { drop = [7, 15], escalc = { measure = "RR", ai = "ai", n1i = "n1i", ci = "ci", n2i = "n2i", add = 0.5, to = "all" } }
args = { x = "yi", vi = "vi", type = "Rosenthal", pool = "stouffer" }
expect = { fsnum = "formulas.fsn_number", pval = "formulas.fsn_pval" }
covers = ["fsn.Rosenthal", "fsn.pool.stouffer"]

[[case]]
id = "bias.fsn.hackshaw1998.rosenthal.stouffer"
kind = "derived"
function = "fsn"
dataset = "dat.hackshaw1998"
args = { x = "yi", vi = "vi", type = "Rosenthal", pool = "stouffer" }
expect = { fsnum = "formulas.fsn_number", pval = "formulas.fsn_pval" }
covers = ["fsn.Rosenthal", "fsn.pool.stouffer"]

