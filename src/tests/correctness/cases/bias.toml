# trimfill: Duval and Tweedie (2000) with the DerSimonian-Laird tau2 they use; the expected values come from `formulas.trimfill_*`. `beta` is the
# pooled estimate over the observed and the mirrored studies.
[[case]]
id = "bias.trimfill.hackshaw1998.l0"
kind = "derived"
function = "trimfill"
dataset = "dat.hackshaw1998"
setup = { rma_uni = { method = "DL" } }
args = { estimator = "L0" }
expect = { k0 = "formulas.trimfill_k0", se_k0 = "formulas.trimfill_se_k0", beta = "formulas.trimfill_beta" }
check = "test_derived.trimfill_filled"
covers = ["trimfill.fill", "trimfill.k0.L0", "trimfill.se_k0.L0", "trimfill.side"]

[[case]]
id = "bias.trimfill.hackshaw1998.r0"
kind = "derived"
