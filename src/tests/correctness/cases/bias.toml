# Publication-bias cases: regtest and ranktest `derived` cases (trimfill, fsn, tes and hc follow in later tasks).
#
# Expected values come from `formulas.regtest_*` (Egger et al. 1997 in its original form; Sterne and Egger 2005; Macaskill et al. 2001; Peters et al.
# 2006; Moreno et al. 2009; Stanley and Doucouliagos 2014; Pustejovsky and Rodgers 2019) and `formulas.begg_*` (Begg and Mazumdar 1994; Kendall 1970).
# dat.egger2001 leaves out ISIS-4 (row 15) as Egger et al.'s example does. dat.hackshaw1998 has no sample sizes, so its `cases` column stands in for
# `ni`: the regression takes any positive covariate. `model = "rma"` cases use `method = "DL"` (closed form, 1e-10); the default REML stops at its
# convergence threshold (1e-5, as metafor does), so its cases state the tolerance 1e-4.
[[case]]
id = "bias.regtest.egger2001.lm.sei"
kind = "derived"
function = "regtest"
dataset = "dat.egger2001"
setup = { drop = [15], escalc = { measure = "OR", ai = "ai", n1i = "n1i", ci = "ci", n2i = "n2i" } }
args = { x = "yi", vi = "vi", model = "lm", predictor = "sei" }
expect = { zval = "formulas.regtest_zval", pval = "formulas.regtest_pval", est = "formulas.regtest_est", ci_lb = "formulas.regtest_ci_lb", ci_ub = "formulas.regtest_ci_ub" }
covers = ["regtest.limit", "regtest.lm.sei"]

