# tes: Ioannidis and Trikalinos (2007) as `formulas.tes_*`: the expected number of significant studies is the sum of the powers at the weighted average;
# the exact test is the Poisson-binomial distribution of the powers (by its characteristic function), so it does not share metafopy's recursion. The
# limit estimate is defined by metafor's `tes` help page (5.2-1): the effect at which the p-value equals `tes_alpha`.
[[case]]
id = "bias.tes.hackshaw1998.exact"
kind = "derived"
function = "tes"
dataset = "dat.hackshaw1998"
args = { x = "yi", vi = "vi", test = "exact" }
expect = { O = "formulas.tes_O", E = "formulas.tes_E", pval = "formulas.tes_pval" }
covers = ["tes.E", "tes.test.exact"]

[[case]]
id = "bias.tes.hackshaw1998.chi2"
kind = "derived"
function = "tes"
dataset = "dat.hackshaw1998"
args = { x = "yi", vi = "vi", test = "chi2", tes_alternative = "two.sided" }
expect = { X2 = "formulas.tes_X2", pval = "formulas.tes_pval" }
covers = ["tes.test.chi2"]

[[case]]
id = "bias.tes.hackshaw1998.binom"
kind = "derived"
function = "tes"
dataset = "dat.hackshaw1998"
args = { x = "yi", vi = "vi", test = "binom" }
expect = { pval = "formulas.tes_pval" }
covers = ["tes.test.binom"]

[[case]]
id = "bias.tes.egger2001.exact"
kind = "derived"
function = "tes"
dataset = "dat.egger2001"
setup = { drop = [15], escalc = { measure = "OR", ai = "ai", n1i = "n1i", ci = "ci", n2i = "n2i" } }
args = { x = "yi", vi = "vi", test = "exact" }
expect = { O = "formulas.tes_O", E = "formulas.tes_E", pval = "formulas.tes_pval" }
covers = ["tes.E", "tes.test.exact"]

[[case]]
id = "bias.tes.hackshaw1998.tau2"
kind = "derived"
function = "tes"
dataset = "dat.hackshaw1998"
args = { x = "yi", vi = "vi", test = "exact", tau2 = 0.1, rel_tol = 1e-10 }
expect = { E = "formulas.tes_E", pval = "formulas.tes_pval" }
tolerance = 0.00005
covers = ["tes.tau2"]

[[case]]
id = "bias.tes.hackshaw1998.theta"
kind = "derived"
function = "tes"
dataset = "dat.hackshaw1998"
args = { x = "yi", vi = "vi", test = "exact", theta = 0.2 }
expect = { E = "formulas.tes_E", pval = "formulas.tes_pval" }
covers = ["tes.E"]

[[case]]
id = "bias.tes.hackshaw1998.theta_lim"
kind = "derived"
function = "tes"
dataset = "dat.hackshaw1998"
args = { x = "yi", vi = "vi", test = "exact" }
expect = { "theta_lim[0]" = "formulas.tes_theta_lim" }
tolerance = 0.0001
covers = ["tes.theta_lim"]

[case.source]
citation = "Viechtbauer W. metafor 5.2-1, help page of tes (https://wviechtb.github.io/metafor/reference/tes.html); Ioannidis JPA, Trikalinos TA (2007). An exploratory test for an excess of significant findings. Clinical Trials 4:245-253"
locator = "metafor help page, Details: the value of theta at which the p-value of the test of excess significance equals tes.alpha is the limit estimate; Ioannidis and Trikalinos p. 246"
read = 2026-11-15
doi = "10.1177/1740774507079441"

# hc: Henmi and Copas (2010), equations 8 and 14 to 21, as `formulas.hc_interval`; `test_derived.hc_interval` compares the interval limits.
[[case]]
id = "bias.hc.lee2004.reml"
kind = "derived"
function = "hc"
dataset = "dat.lee2004"
setup = { escalc = { measure = "OR", ai = "ai", n1i = "n1i", ci = "ci", n2i = "n2i" }, rma_uni = { method = "REML" } }
args = {}
expect = { beta = "formulas.hc_beta", tau2 = "formulas.hc_tau2" }
check = "test_derived.hc_interval"
tolerance = 0.00001
covers = ["hc.ci", "hc.estimate"]

[[case]]
id = "bias.hc.egger2001.dl"
kind = "derived"
function = "hc"
dataset = "dat.egger2001"
setup = { drop = [15], escalc = { measure = "OR", ai = "ai", n1i = "n1i", ci = "ci", n2i = "n2i" }, rma_uni = { method = "DL" } }
args = {}
expect = { beta = "formulas.hc_beta", tau2 = "formulas.hc_tau2" }
check = "test_derived.hc_interval"
tolerance = 0.00001
covers = ["hc.ci", "hc.estimate"]
