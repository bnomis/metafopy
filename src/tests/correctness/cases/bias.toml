expect = { k0 = "formulas.trimfill_k0", se_k0 = "formulas.trimfill_se_k0", p_k0 = "formulas.trimfill_p_k0", beta = "formulas.trimfill_beta" }
check = "test_derived.trimfill_filled"
covers = ["trimfill.fill", "trimfill.k0.R0", "trimfill.p_k0", "trimfill.se_k0.R0"]

