# Published case: the values Viechtbauer and Cheung (2010) print in section 5.1 for the 13 BCG trials of their Table I.
[[case]]
id = "uni.diag.published.bcg"
kind = "published"
function = "rma_uni"
data = { tpos = [4, 6, 3, 62, 33, 180, 8, 505, 29, 17, 186, 5, 27], tneg = [119, 300, 228, 13536, 5036, 1361, 2537, 87886, 7470, 1699, 50448, 2493, 16886], cpos = [11, 29, 11, 248, 47, 372, 10, 499, 45, 65, 141, 3, 29], cneg = [128, 274, 209, 12619, 5761, 1079, 619, 87892, 7232, 1600, 27197, 2338, 17825], ablat_c = [11, 22, 9, 19, -20, 11, -14, -20, -6, 9, -15, 0, 0], year_c = [-18, -17, -6, 11, 7, -13, 7, 14, 2, -5, 8, 3, 10] }
setup = { escalc = { measure = "RR", ai = "tpos", bi = "tneg", ci = "cpos", di = "cneg" } }
args = { yi = "yi", vi = "vi", method = "DL", mods = "~ ablat_c + year_c" }
check = "test_published.influence_printed"
printed = { "tau2" = "0.0790", "hat[3]" = "0.82", "rstudent[3]" = "-1.51", "cook.d[3]" = "9.64", "R[3]" = "14.50", "hat[6]" = "0.07", "rstudent[6]" = "-2.65", "cook.d[6]" = "0.41", "R[6]" = "43.24", "hat[12]" = "0.15", "rstudent[12]" = "2.06", "cook.d[12]" = "0.59", "R[12]" = "26.18", "dfbetas[3,0]" = "-0.87", "dfbetas[3,1]" = "-2.86", "dfbetas[3,2]" = "-2.47" }
covers = ["rma_uni.cooks_distance.me", "rma_uni.dfbetas.me", "rma_uni.rstudent.me", "rma_uni.influence.hat", "rma_uni.influence.tau2_del"]
source = { citation = "Viechtbauer W, Cheung MW-L (2010). Outlier and influence diagnostics for meta-analysis. Res Synth Methods 1:112-125; metafor 5.2-1, help pages influence.rma.uni and residuals.rma", doi = "10.1002/jrsm.11", locator = "section 5.1 and Table I (13 BCG trials; latitude centred at 33, year at 1966; DL, equation 9): tau2 0.0790, h, t, D and R of studies 4, 7 and 13 and the DFBETAS of study 4 (study 4 is index 3)", read = 2026-11-20 }

# Derived cases: every deletion diagnostic against explicit leave-one-out refits (formulas.uni_deletion).
# The paper's fit; also covers every influence column and rstandard.
[[case]]
id = "uni.diag.dl.bcg"
kind = "derived"
function = "rma_uni"
data = { tpos = [4, 6, 3, 62, 33, 180, 8, 505, 29, 17, 186, 5, 27], tneg = [119, 300, 228, 13536, 5036, 1361, 2537, 87886, 7470, 1699, 50448, 2493, 16886], cpos = [11, 29, 11, 248, 47, 372, 10, 499, 45, 65, 141, 3, 29], cneg = [128, 274, 209, 12619, 5761, 1079, 619, 87892, 7232, 1600, 27197, 2338, 17825], ablat_c = [11, 22, 9, 19, -20, 11, -14, -20, -6, 9, -15, 0, 0], year_c = [-18, -17, -6, 11, 7, -13, 7, 14, 2, -5, 8, 3, 10] }
setup = { escalc = { measure = "RR", ai = "tpos", bi = "tneg", ci = "cpos", di = "cneg" } }
args = { yi = "yi", vi = "vi", method = "DL", mods = "~ ablat_c + year_c" }
check = "test_derived.uni_deletion"
covers = ["rma_uni.cooks_distance.me", "rma_uni.dfbetas.me", "rma_uni.rstudent.me", "rma_uni.influence.cov_r", "rma_uni.influence.dffits", "rma_uni.influence.hat", "rma_uni.influence.qe_del", "rma_uni.influence.tau2_del", "rma_uni.rstandard.marginal"]
then = { function = "rstudent", args = {} }
source = { citation = "Viechtbauer W, Cheung MW-L (2010). Outlier and influence diagnostics for meta-analysis. Res Synth Methods 1:112-125; metafor 5.2-1, help pages influence.rma.uni and residuals.rma", doi = "10.1002/jrsm.11", locator = "equation 20 for Cook's distance (the chi-square form, with no division by p), equation 23 for DFBETAS with the variance of the coefficients refitted without the study, equations 15 and 16 for the externally studentised residual, equation 19 for DFFITS, equation 25 for COVRATIO, equations 13 and 14 for the hat value and the internally studentised residual, tau2 and QE of the refit without the study (equation 27 for R)", read = 2026-11-20 }

