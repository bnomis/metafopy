# Correctness cases for the tau2 estimators of rma_uni (coverage items `tau2.<method>`).
#
# `derived` cases: tau2, the coefficients and their standard errors come from `formulas.rma_tau2` and `formulas.fixed_effects_fit`, coded from
# the estimating or moment equation of each method. The `control` tightens the convergence settings of the iterative estimators so that the
# comparison measures the estimator, not the stopping rule.

[[case]]
id = "tau2.ee.bcg"
kind = "derived"
function = "rma_uni"
dataset = "dat.bcg"
setup = { escalc = { measure = "RR", ai = "tpos", bi = "tneg", ci = "cpos", di = "cneg" } }
args = { yi = "yi", vi = "vi", method = "EE" }
expect = { tau2 = "formulas.rma_tau2", beta = "formulas.rma_beta", se = "formulas.rma_se" }
covers = ["tau2.EE"]

[[case]]
id = "tau2.ee.bcg.ablat"
kind = "derived"
function = "rma_uni"
dataset = "dat.bcg"
setup = { escalc = { measure = "RR", ai = "tpos", bi = "tneg", ci = "cpos", di = "cneg" } }
args = { yi = "yi", vi = "vi", method = "EE", mods = "~ ablat" }
expect = { tau2 = "formulas.rma_tau2", beta = "formulas.rma_beta", se = "formulas.rma_se" }
covers = ["tau2.EE"]

[[case]]
