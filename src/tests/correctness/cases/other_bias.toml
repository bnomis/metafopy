# Other-software publication-bias cases from R weightr and R meta, written by src/tests/correctness/r/other_software_bias.R; do not edit by hand.
#
# weightr does not depend on metafor, so its step-function cases check selmodel against separate code. meta's Egger, Begg and Peters tests and its
# trim and fill are its own code; its random-effects refits take tau2 from DerSimonian-Laird (meta's own), so they check the pipeline around tau2,
# not the estimator. meta's Harbord test has no counterpart in metafopy's regtest (its predictors are sei, vi, ni, ninv, sqrtni and sqrtninv), so
# it has no case.

[[case]]
id = "other.bias.weightr.estimated.two_intervals"
kind = "other"
function = "selmodel"
dataset = "dat.bangertdrowns2004"
setup = { rma_uni = { method = "ML" } }
args = { type = "stepfun", steps = [0.025000000000000001, 1] }
expect = { "beta[0]" = 0.14765240192244147, "se[0]" = 0.07311080774006741, "tau2" = 0.027556555459299786, "delta[1]" = 0.46643638778520069, "LRT" = 1.1635442280603172 }
tolerance = 0.0001

[case.source]
citation = "R package weightr 2.0.2 (Coburn KM, Vevea JL (2019). weightr: Estimating Weight-Function Models for Publication Bias), run on R 4.6.2. Vevea JL, Hedges LV (1995). A general linear model for estimating effect size in the presence of publication bias. Psychometrika 60:419-435."
locator = "weightfunct(steps = c(0.025, 1)) on dat.bangertdrowns2004 (k = 48): adj_est (tau2, mean, weights), adj_se, and the likelihood-ratio statistic 2 * (logLik adjusted - logLik unadjusted)"
read = 2026-11-15
url = "https://cran.r-project.org/package=weightr"

