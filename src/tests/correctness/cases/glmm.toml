# Correctness cases for rma_glmm: derived and property cases; see agents/specs/correctness-glmm/spec.md

# Task 4: OR fit cases. Each case reads the formulas' own fit of the same call (glmm_formulas.rma_glmm_*); a mixed fit also runs
# test_derived.glmm_likelihood_at_estimate. UM.RS with ML uses the Laplace approximation (lme4 allows no more with two random effects), CM.EL the
# exact integral (control int_rel_tol tightened) and the other fits adaptive quadrature with nAGQ = 7. The CM.EL standard errors are recorded as
# mismatches in agents/specs/correctness-glmm/mismatches.md. UM.RS with ML has no case on dat.nielweise2007: that fit is nearly unidentifiable
# (R metafor warns of it too) and the formulas' search stops at a score of 1.3e-6, above the 1e-6 it requires.

[[case]]
id = "glmm.fit.or.cm.al.fe.nielweise2007.beta"
kind = "derived"
function = "rma_glmm"
dataset = "dat.nielweise2007"
args = { ai = "ai", n1i = "n1i", ci = "ci", n2i = "n2i", measure = "OR", model = "CM.AL", method = "FE" }
expect = { "beta[0]" = "glmm_formulas.rma_glmm_beta" }
tolerance = 1e-8
covers = ["rma_glmm.fit.OR.CM.AL.FE"]

[[case]]
id = "glmm.fit.or.cm.al.fe.nielweise2007.se"
kind = "derived"
function = "rma_glmm"
dataset = "dat.nielweise2007"
args = { ai = "ai", n1i = "n1i", ci = "ci", n2i = "n2i", measure = "OR", model = "CM.AL", method = "FE" }
expect = { "se[0]" = "glmm_formulas.rma_glmm_se" }
tolerance = 1e-6
covers = ["rma_glmm.fit.OR.CM.AL.FE"]

[[case]]
id = "glmm.fit.or.cm.al.ml.nielweise2007"
kind = "derived"
function = "rma_glmm"
dataset = "dat.nielweise2007"
args = { ai = "ai", n1i = "n1i", ci = "ci", n2i = "n2i", measure = "OR", model = "CM.AL", method = "ML" }
expect = { "beta[0]" = "glmm_formulas.rma_glmm_beta", "se[0]" = "glmm_formulas.rma_glmm_se", tau2 = "glmm_formulas.rma_glmm_tau2" }
