# Task 6: package and optimiser cases. A package case reads the formulas' log-likelihood of the approximation the package uses (adaptive quadrature
# with nAGQ = 7 points for lme4 and GLMMadaptive, the Laplace approximation for glmmTMB), maximised by the formulas' own search, and the check
# test_derived.glmm_likelihood_at_estimate compares it with the log-likelihood at the estimates of metafopy. The accurate-integral cases fit with
# many quadrature points (GLMMadaptive) or a tight int_rel_tol (CM.EL) and compare with the exact integral. An optimiser case fits CM.EL for OR
# on dat.nielweise2007 with each optimiser of metafor's control$optimizer and compares the estimates with the exact fit at 1e-4;
# clogit and clogistic fit the fixed-effects model only.

[[case]]
id = "glmm.package.lme4.um.fs.ml.nielweise2007"
kind = "derived"
function = "rma_glmm"
dataset = "dat.nielweise2007"
args = { ai = "ai", n1i = "n1i", ci = "ci", n2i = "n2i", measure = "OR", model = "UM.FS", method = "ML", control = { package = "lme4" } }
expect = { "beta[0]" = "glmm_formulas.rma_glmm_beta", "se[0]" = "glmm_formulas.rma_glmm_se", tau2 = "glmm_formulas.rma_glmm_tau2" }
tolerance = 1e-5
check = "test_derived.glmm_likelihood_at_estimate"
covers = ["rma_glmm.package.lme4"]

