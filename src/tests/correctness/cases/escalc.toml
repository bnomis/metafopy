# Proof of the derived path: the risk difference and its large-sample variance, from formulas.py, on inline data with no zero cell.
[[case]]
id = "escalc.rd.ls.formula"
kind = "derived"
function = "escalc"
args = { measure = "RD", ai = "ai", bi = "bi", ci = "ci", di = "di", vtype = "LS" }
expect = { yi = "formulas.risk_difference_yi", vi = "formulas.risk_difference_vi" }
covers = ["escalc.yi.RD", "escalc.vi.RD.LS"]

[case.data]
ai = [12.0, 20.0, 8.0]
bi = [88.0, 80.0, 92.0]
ci = [18.0, 25.0, 14.0]
di = [82.0, 75.0, 86.0]

