# Correctness cases for escalc: effect sizes (yi) and sampling variances (vi).
#
# `vtypes` lists, for every measure of metafopy.effects.measures.MEASURES, the `vtype` values escalc accepts (read on 2026-11-11 from the options
# escalc validates and the escalc docstring; a measure that ignores `vtype` lists only the default, "LS"). It is the same list as a series of
# [[vtypes]] entries. test_coverage.py checks that escalc accepts every pair, and the coverage gate needs a published or derived case (or an
# [[exempt]] entry) for `escalc.yi.<measure>` and for `escalc.vi.<measure>.<vtype>` of each pair.

