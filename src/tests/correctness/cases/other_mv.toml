# Other-software cases for rma_mv and robust, written by src/tests/correctness/r/other_software_mv.R; do not edit by hand.
#
# mvmeta, nlme, robumeta and sandwich do not depend on metafor, so these values are independent of it. See the script for the conventions it pins.

[[case]]
id = "other.mv.un.berkey"
kind = "other"
function = "rma_mv"
dataset = "dat.berkey1998"
setup = { vblocks = { cluster = "trial", columns = ["v1i", "v2i"] } }
args = { yi = "yi", mods = "~ 0 + outcome", random = "~ outcome | trial", struct = "UN" }
expect = { "beta[0]" = -0.33921516435239185, "beta[1]" = 0.35342815244324544, "se[0]" = 0.087905151799501424, "se[1]" = 0.058848626558107048, "tau2[0]" = 0.032651345776739102, "tau2[1]" = 0.011733022784552627, "rho[0]" = 0.6087992530999935 }
tolerance = 1.0000000000000001e-05

[case.source]
citation = "mvmeta 1.0.3, run on R 4.6.2. Gasparrini A, Armstrong B, Kenward MG (2012). Multivariate meta-analysis for non-linear and other multi-parameter associations. Statistics in Medicine 31:3821-3839."
locator = "mvmeta(cbind(yAL, yPD), S, method = 'reml'): coef, sqrt(diag(vcov)), Psi (outcomes ordered AL, PD as the outcome factor of the metafopy case)"
read = 2026-11-14
url = "https://cran.r-project.org/package=mvmeta"

[[case]]
