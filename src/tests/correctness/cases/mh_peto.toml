# Correctness cases for rma_mh (coverage items `rma_mh.<measure>.estimate` and `rma_mh.<measure>.variance`) and rma_peto (`rma_peto`).
#
# `derived` cases for the pooled estimate (`beta`) and its standard error (`se`) from the formulas in `formulas.py`, coded from the publications: Mantel
# and Haenszel (1959) and Robins, Breslow and Greenland (1986) for the odds ratio, Greenland and Robins (1985) for the risk ratio and the incidence
# measures, Sato, Greenland and Robins (1989) for the risk difference variance and Yusuf et al. (1985) for Peto. The 2x2 cases run on dat.bcg and on
# small tables with a zero cell; the rate cases on small rate tables with a zero count. Nothing is added to the counts entering the pooled estimate
# (the default), so the formulas take the tables as given.

[[case]]
id = "rma_mh.or.bcg"
kind = "derived"
function = "rma_mh"
dataset = "dat.bcg"
args = { ai = "tpos", bi = "tneg", ci = "cpos", di = "cneg", measure = "OR" }
expect = { beta = "formulas.mh_or_beta", se = "formulas.mh_or_se" }
covers = ["rma_mh.OR.estimate", "rma_mh.OR.variance"]

[[case]]
id = "rma_mh.or.zero-cell"
kind = "derived"
function = "rma_mh"
args = { ai = "ai", bi = "bi", ci = "ci", di = "di", measure = "OR" }
expect = { beta = "formulas.mh_or_beta", se = "formulas.mh_or_se" }
covers = ["rma_mh.OR.estimate", "rma_mh.OR.variance"]

[case.data]
ai = [0, 3, 6, 2, 9]
bi = [28, 47, 34, 58, 41]
ci = [2, 5, 8, 0, 10]
di = [30, 45, 32, 60, 39]

