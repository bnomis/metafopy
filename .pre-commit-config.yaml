repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # The shared audit hooks, pinned to one commit of the checker.
  - repo: https://github.com/bnomis/auditor
    rev: 2107437316216b2aa0f3c98dca69823359bb25ca
    hooks:
      - id: auditme-changed
        language_version: python3.14
      - id: auditme-all
        language_version: python3.14
        stages: [manual, pre-push]
