repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # The shared audit hooks, pinned to one commit of the checker.
  - repo: git@github.com:bnomis/agents.git
    rev: 8d97d96d3dc96ab015ff12e1adf99496ed8d1177
    hooks:
      - id: auditme-changed
      - id: auditme-all
        stages: [manual, pre-push]
