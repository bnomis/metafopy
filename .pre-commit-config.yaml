repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # The shared audit hooks, pinned to one commit of the checker.
  - repo: git@github.com:bnomis/agents.git
    rev: 49dab9d0a0df57f11845773a8366422cbdcef109
    hooks:
      - id: auditme-changed
      - id: auditme-all
        stages: [manual, pre-push]
