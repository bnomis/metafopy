repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # The shared audit hooks, pinned to one commit of the checker.
  - repo: git@github.com:bnomis/auditor.git
    rev: 6a65d14a8dcb8e533e0107784f566f5e8fe87057
    hooks:
      - id: auditme-changed
      - id: auditme-all
        stages: [manual, pre-push]
