repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # The shared audit hooks, pinned to one commit of the checker.
  - repo: git@github.com:bnomis/auditor.git
    rev: 717d4af03e5d50448406cf828e6616442705eb64
    hooks:
      - id: auditme-changed
      - id: auditme-all
        stages: [manual, pre-push]
