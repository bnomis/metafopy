site_name: metafopy
site_description: Meta-analysis in Python, a re-implementation of the R package metafor
repo_url: https://github.com/bnomis/metafopy
theme:
  name: material
  logo: assets/metafopy-mark.svg
  favicon: assets/favicon.svg
  # Mona Sans for text, Source Code Pro for code; both served by Google Fonts.
  # https://squidfunk.github.io/mkdocs-material/setup/changing-the-fonts/
  font:
    text: Mona Sans
    code: Source Code Pro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
extra_css:
  - assets/theme.css
extra_javascript:
  - assets/favicon-animate.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      include: ["*.ipynb"]
      ignore: ["*.md", "*.py"]
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
nav:
  - Home: index.md
  - Installation: install.md
  - Getting started: getting-started.md
  - User guide:
      - Effect sizes: guide/effect-sizes.md
      - Fitting models: guide/models.md
      - Binary and count data: guide/binary.md
      - Multilevel and multivariate models: guide/multilevel.md
      - Selection and location-scale models: guide/advanced.md
      - Diagnostics: guide/diagnostics.md
      - Publication bias: guide/bias.md
      - Estimated marginal means: guide/emmeans.md
      - Plots: guide/plots.md
      - Plot gallery: guide/gallery.md
      - Datasets: guide/datasets.md
  - Showcase: notebooks/showcase.ipynb
  - Analyses: analyses.md
  - Coming from R: from-r.md
  - Function reference:
      - Overview: reference/index.md
      - Effect sizes: reference/effects.md
      - Models: reference/models.md
      - Methods for fitted models: reference/methods.md
      - Publication bias: reference/bias.md
      - Plots: reference/plots.md
      - Transformations: reference/transf.md
      - Datasets: reference/datasets.md
      - Errors: reference/errors.md
  - Differences from metafor:
      - Overview: differences.md
      - Detailed notes: differences-notes.md
      - Plots compared with metafor: differences-plots.md
