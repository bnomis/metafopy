name: R fixtures

# Regenerates the R metafor reference fixtures and fails if they differ from
# the committed ones. Run manually to check a pinned version, or weekly to see
# whether the latest CRAN metafor changed any results.

on:
  workflow_dispatch:
    inputs:
      metafor_version:
        description: "metafor version to install (empty = latest CRAN)"
        default: "5.2-1"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  regenerate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - name: Install R packages
        env:
          METAFOR_VERSION: ${{ inputs.metafor_version }}
        run: |
          Rscript -e 'install.packages(c("remotes", "jsonlite", "metadat", "gsl", "mvtnorm", "CompQuadForm"))'
          Rscript -e 'v <- Sys.getenv("METAFOR_VERSION"); if (nzchar(v)) remotes::install_version("metafor", version = v, upgrade = "never") else install.packages("metafor")'
      - run: Rscript src/tests/r/export_datasets.R
      - run: Rscript src/tests/r/generate_fixtures.R
      - run: Rscript src/tests/r/generate_extras.R
      - run: Rscript src/tests/r/generate_escalc.R
      - run: Rscript src/tests/r/generate_rma_uni_help.R
      - run: Rscript src/tests/r/generate_blup_vif.R
      - run: Rscript src/tests/r/generate_transf.R
      - run: Rscript src/tests/r/generate_diagnostics.R
      - run: Rscript src/tests/r/generate_bias.R
      - run: Rscript src/tests/r/generate_plots.R
      - name: Fail on fixture drift
        run: git diff --stat --exit-code -- src/tests/reference src/metafopy/datasets/data
