name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.3 # v10.3.0
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # the audit checker needs ruff and python3 on PATH, and pre-commit to run its hooks
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv tool install pre-commit
      # the checker loads its rules from AUDITOR_RULES_PATH; pin the public rules repository to the commit the local .envrc's copy is at, so CI and
      # the local hooks run the same rules. Cloned outside the workspace so the audit never reads it as part of this project.
      - name: Fetch the audit rules
        run: |
          git clone --quiet https://github.com/bnomis/auditor-rules "$RUNNER_TEMP/auditor-rules"
          git -C "$RUNNER_TEMP/auditor-rules" checkout --quiet f0ccb9adae7c25179aead8cea60cc12fd261dabd
          echo "AUDITOR_RULES_PATH=$RUNNER_TEMP/auditor-rules" >> "$GITHUB_ENV"

      - name: Audit the whole tree
        run: pre-commit run auditme-all --hook-stage manual --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025-vs2026]
        python-version: ["3.14.8"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.3 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest --mpl --cov --cov-report=term-missing
