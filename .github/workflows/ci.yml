name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.2 # v10.3.0
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # the audit checker needs ruff and python3 on PATH, and pre-commit to run its hooks
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv tool install pre-commit
      - name: Install the audit deploy key
        env:
          AGENTS_DEPLOY_KEY: ${{ secrets.AGENTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AGENTS_DEPLOY_KEY" > ~/.ssh/agents_deploy_key
          chmod 600 ~/.ssh/agents_deploy_key
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          {
            echo 'Host github-agents'
            echo '  HostName github.com'
            echo '  User git'
            echo '  IdentityFile ~/.ssh/agents_deploy_key'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
          } >> ~/.ssh/config
          git config --global url."git@github-agents:bnomis/agents.git".insteadOf "git@github.com:bnomis/agents.git"

      - name: Audit the whole tree
        run: pre-commit run auditme-all --hook-stage manual --all-files

      - name: Remove the audit deploy key
        if: always()
        run: rm -f ~/.ssh/agents_deploy_key

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025-vs2026]
        python-version: ["3.14.8"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.2 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest --mpl --cov --cov-report=term-missing
