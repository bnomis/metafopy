name: Docs

on:
  pull_request:
    paths: [docs/**, mkdocs.yml, src/**]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv venv
      - run: uv pip install -e . -r docs/requirements.txt
      - run: .venv/bin/mkdocs build --strict
